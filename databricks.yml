# This is a Declarative Automation Bundle definition for ageas_interview.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ageas_interview
  uuid: a9bb2882-a70a-47fc-84af-256bdf213fe1

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-2a4eb427-26c0.cloud.databricks.com
    variables:
      catalog: ageas
      schema: ageas
  prod:
    mode: production
    workspace:
      host: https://dbc-2a4eb427-26c0.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/robertianmel@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/robertianmel@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ageas
      schema: ageas
    permissions:
      - user_name: robertianmel@gmail.com
        level: CAN_MANAGE

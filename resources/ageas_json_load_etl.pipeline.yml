# The main pipeline for ageas_interview

resources:
  pipelines:
    ageas_interview_etl:
      name: ageas_json_load_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/ageas_interview_etl"

      libraries:
        - glob:
            include: ../src/ageas_interview_etl/transformations/**
